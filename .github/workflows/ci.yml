name: Verify EDA Extension Doctor

on:
  push:
    branches:
      - main
      - agent/extension-doctor-m1
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify contracts, types and build
        run: npm run verify

      - name: Verify runtime-only EEXT contents
        shell: bash
        run: |
          set -euo pipefail
          package="build/dist/eda-extension-doctor_v0.3.3.eext"
          test -f "$package"
          unzip -Z1 "$package" | tee /tmp/eext-files.txt
          grep -Fxq 'extension.json' /tmp/eext-files.txt
          grep -Fxq 'dist/index.js' /tmp/eext-files.txt
          grep -Fxq 'images/logo.jpg' /tmp/eext-files.txt
          grep -Fxq 'iframe/index.html' /tmp/eext-files.txt
          grep -Fxq 'iframe/confirm-bridge.js' /tmp/eext-files.txt
          grep -Fxq 'iframe/doctor.js' /tmp/eext-files.txt
          unzip -p "$package" extension.json | grep -Fq '"logo": "./images/logo.jpg"'
          unzip -p "$package" images/logo.jpg > /tmp/doctor-logo.jpg
          test "$(wc -c < /tmp/doctor-logo.jpg)" -gt 10000
          file /tmp/doctor-logo.jpg | grep -Fq 'JPEG image data'
          unzip -p "$package" iframe/index.html | grep -Fq 'src="/iframe/confirm-bridge.js"'
          unzip -p "$package" iframe/index.html | grep -Fq 'src="/iframe/doctor.js"'
          bridge_line="$(unzip -p "$package" iframe/index.html | grep -n 'src="/iframe/confirm-bridge.js"' | head -n1 | cut -d: -f1)"
          doctor_line="$(unzip -p "$package" iframe/index.html | grep -n 'src="/iframe/doctor.js"' | head -n1 | cut -d: -f1)"
          test "$bridge_line" -lt "$doctor_line"
          unzip -p "$package" iframe/confirm-bridge.js | grep -Fq "Object.defineProperty(window, 'prompt'"
          unzip -p "$package" iframe/confirm-bridge.js | grep -Fq "Object.defineProperty(window, 'alert'"
          unzip -p "$package" iframe/confirm-bridge.js | grep -Fq 'window.confirm('
          unzip -p "$package" iframe/confirm-bridge.js | grep -Fq '这不表示删除失败'
          unzip -p "$package" iframe/index.html | grep -Fq '完全退出并重新启动后才会从编辑器界面消失'
          unzip -p "$package" iframe/index.html | grep -Fq '扫描孤儿残留'
          unzip -p "$package" iframe/doctor.js | grep -Fq 'seenOrigins.has(origin)'
          unzip -p "$package" iframe/doctor.js | grep -Fq "{ label: 'parent'"
          unzip -p "$package" iframe/doctor.js | grep -Fq 'async function scanOrphans()'
          unzip -p "$package" iframe/doctor.js | grep -Fq 'async function cleanOrphan(uuid)'
          unzip -p "$package" iframe/doctor.js | grep -Fq 'ORPHAN_BECAME_INSTALLED'
          unzip -p "$package" iframe/doctor.js | grep -Fq "[STORE_OBJECTS, STORE_CONFIG], 'readwrite'"
          if unzip -p "$package" iframe/index.html | grep -Fq 'src="./doctor.js"'; then
            echo 'Relative iframe doctor.js path must not be packaged' >&2
            exit 1
          fi
          for forbidden in '.github/' 'build/' 'config/' 'docs/' 'node_modules/' 'src/' 'tests/' 'package.json' 'tsconfig.json'; do
            if grep -Fq "$forbidden" /tmp/eext-files.txt; then
              echo "Forbidden EEXT content found: $forbidden" >&2
              exit 1
            fi
          done
